<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vlaggenjacht">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vlaggenjacht</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff6e5;--ink:#2b2350;--muted:#6b6490;--card:#fff;--sun:#ffc43d;--coral:#ff6b6b;--mint:#2ec4a6;--sky:#4d96ff;--grape:#9b5de5;--good:#22b573;--bad:#ef4b4b;--sea:#cfe8ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Fredoka',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    background-image:radial-gradient(circle at 10% 10%,#ffe3b3 0 60px,transparent 61px),radial-gradient(circle at 92% 18%,#ffd6e0 0 40px,transparent 41px),radial-gradient(circle at 85% 92%,#d6ecff 0 70px,transparent 71px);
    overflow-x:hidden;user-select:none;-webkit-user-select:none}
  .wrap{max-width:620px;margin:0 auto;padding:16px 16px 32px;min-height:100%}
  .screen{display:none}
  .screen.on{display:block;animation:pop .25s ease}
  .screen>*+*{margin-top:14px}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
  .topbar{display:flex;align-items:center;justify-content:space-between}
  .icon-btn{width:52px;height:52px;border-radius:18px;background:var(--card);font-size:26px;box-shadow:0 4px 0 #e8dcc4;flex:none}
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e8dcc4}
  h1{font-size:44px;line-height:1;margin:4px 0 0;text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:19px;margin:0}
  .flagrow{display:flex;justify-content:center}
  .flagrow .f{width:54px;margin:4px;animation:wave 2.4s ease-in-out infinite}
  @keyframes wave{50%{transform:rotate(-6deg) translateY(-4px)}}
  .label{font-weight:600;font-size:18px;margin:18px 0 6px 4px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;margin:-4px}
  .chip{margin:4px;background:var(--card);border-radius:16px;padding:8px 12px;font-size:17px;font-weight:600;box-shadow:0 4px 0 #e8dcc4;border:3px solid transparent}
  .chip.sel{border-color:var(--grape);background:#f3eaff}
  .levels{display:flex;margin:0 -5px}
  .lvl{flex:1;margin:0 5px;background:var(--card);border-radius:20px;padding:10px 4px;box-shadow:0 5px 0 #e8dcc4;font-size:16px;font-weight:600;text-align:center;border:3px solid transparent}
  .lvl .e{display:block;font-size:30px}
  .lvl small{display:block;font-weight:500;color:var(--muted);font-size:13px}
  .lvl.sel{border-color:var(--grape);background:#f3eaff}
  .mode{display:flex;align-items:center;width:100%;padding:14px 16px;border-radius:22px;color:#fff;font-size:22px;font-weight:600;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.18);margin-bottom:12px}
  .mode:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .mode .e{font-size:36px;width:48px;text-align:center;margin-right:12px;flex:none}
  .mode .t{flex:1}
  .mode small{display:block;font-size:15px;font-weight:500;opacity:.92}
  .mode .best{font-size:14px;background:rgba(255,255,255,.25);padding:4px 9px;border-radius:12px;white-space:nowrap;margin-left:8px}
  .m1{background:var(--mint)} .m2{background:var(--sky)} .m3{background:var(--grape)} .m4{background:var(--coral)} .m5{background:#f08a24}
  .f{display:block;width:100%;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px rgba(43,35,80,.12)}
  .f img{display:block;width:100%;height:auto}
  .learn-card{background:var(--card);border-radius:28px;padding:22px;box-shadow:0 6px 0 #e8dcc4;text-align:center}
  .learn-card .f{max-width:340px;margin:0 auto;border-radius:14px}
  .bigname{font-size:34px;font-weight:700;margin:14px 0 4px}
  .hint{font-size:19px;color:var(--muted);margin:0}
  .cont-tag{display:inline-block;margin-top:10px;font-size:15px;background:#f3eaff;color:#6a3fb8;padding:4px 10px;border-radius:10px}
  .learn-nav{display:flex}
  .learn-nav button{flex:1;height:72px;border-radius:22px;font-size:34px;background:var(--sun);box-shadow:0 5px 0 #d9a22a}
  .learn-nav button+button{margin-left:12px}
  .learn-nav button:active{transform:translateY(4px);box-shadow:0 1px 0 #d9a22a}
  .learn-nav .speak{background:var(--grape);color:#fff;box-shadow:0 5px 0 #7440b8}
  .counter{font-size:18px;color:var(--muted)}
  .dots{display:flex;flex:1;justify-content:center;flex-wrap:wrap;padding:0 6px}
  .dot{width:15px;height:15px;border-radius:50%;background:#e8dcc4;margin:2px}
  .dot.now{background:var(--sun);transform:scale(1.25)}
  .dot.ok{background:var(--good)} .dot.no{background:var(--bad)}
  .stars{font-size:22px;font-weight:700;background:var(--card);padding:8px 12px;border-radius:16px;box-shadow:0 4px 0 #e8dcc4;white-space:nowrap;flex:none}
  .question{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 6px 0 #e8dcc4;text-align:center}
  .question .ask{font-size:19px;color:var(--muted);margin:0 0 6px}
  .question .target{font-size:32px;font-weight:700;margin:0;display:flex;align-items:center;justify-content:center}
  .question .f{max-width:280px;margin:0 auto;border-radius:14px}
  .question.small-flag .f{max-width:130px}
  .question.small-flag{display:flex;align-items:center;padding:12px 14px;text-align:left}
  .question.small-flag .f{margin:0 14px 0 0;flex:none;width:110px}
  .mini-speak{width:46px;height:46px;border-radius:50%;background:var(--grape);color:#fff;font-size:22px;flex:none;box-shadow:0 3px 0 #7440b8;margin-left:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px}
  .grid.three .opt:first-child{grid-column:1 / -1;width:62%;justify-self:center}
  .grid.many{grid-template-columns:1fr 1fr 1fr;grid-gap:8px}
  .grid.many4{grid-template-columns:1fr 1fr 1fr 1fr;grid-gap:6px}
  .grid.many .opt,.grid.many4 .opt{padding:5px;border-radius:12px;border-width:3px}
  .opt{display:block;width:100%;background:var(--card);border-radius:20px;padding:10px;box-shadow:0 5px 0 #e8dcc4;border:4px solid transparent}
  .opt:active{transform:scale(.97)}
  .opt.ok{border-color:var(--good);background:#e4f8ee;animation:bounce .5s}
  .opt.no{border-color:var(--bad);background:#fde8e8;animation:shake .4s}
  .opt.dim{opacity:.35}
  @keyframes bounce{30%{transform:scale(1.08)}60%{transform:scale(.97)}}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .names .opt+.opt{margin-top:10px}
  .nameopt{display:flex;align-items:center;padding:8px 8px 8px 18px;font-size:23px;font-weight:600;text-align:left}
  .nameopt .t{flex:1}
  .feedback{min-height:60px;text-align:center;font-size:23px;font-weight:600}
  .next{background:var(--sun);border-radius:22px;padding:14px 26px;font-size:24px;font-weight:700;box-shadow:0 5px 0 #d9a22a;margin-top:10px}
  .next:active{transform:translateY(4px);box-shadow:0 1px 0 #d9a22a}
  .mapbox{background:var(--sea);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 #b6d4f0;position:relative}
  .mapbox svg{display:block;width:100%;height:auto}
  .land{fill:#e9e4da;stroke:#fff;stroke-linejoin:round}
  .land.play{fill:#ffe08a;cursor:pointer}
  .land.right{fill:#57d39b}
  .land.wrong{fill:#ff8f8f}
  .land.flash{animation:flash 1s 2}
  @keyframes flash{50%{fill:#57d39b}}
  .pin{pointer-events:none}
  .maphint{font-size:16px;color:var(--muted);text-align:center;margin-top:8px}
  .end{background:var(--card);border-radius:28px;padding:26px 18px;box-shadow:0 6px 0 #e8dcc4;text-align:center;margin-top:20px}
  .end>*+*{margin-top:14px}
  .end .trophy{font-size:84px;animation:bounce 1s infinite}
  .end h2{font-size:32px;margin:0}
  .end .starline{font-size:26px;line-height:1.3}
  .end .btns button{display:block;width:100%;height:64px;border-radius:22px;font-size:22px;font-weight:600;color:#fff;margin-top:10px}
  .again{background:var(--mint);box-shadow:0 5px 0 #1f9580}
  .home{background:var(--sky);box-shadow:0 5px 0 #2f6fd0}
  .review{display:flex;flex-wrap:wrap;justify-content:center}
  .review .f{width:64px;margin:4px}
  .confetti{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:9;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .burst{position:fixed;font-size:54px;pointer-events:none;z-index:9;animation:burst .9s ease-out forwards}
  @keyframes burst{0%{transform:scale(.3);opacity:1}70%{opacity:1}100%{transform:translateY(-120px) scale(1.4);opacity:0}}
</style>
</head>
<body>
<div class="wrap">

  <section class="screen on" id="s-home">
    <div class="topbar"><span></span><button class="icon-btn" id="soundBtn" aria-label="Geluid aan of uit">🔊</button></div>
    <h1>Vlaggenjacht</h1>
    <p class="sub">Welke vlag hoort bij welk land?</p>
    <div class="flagrow" id="heroFlags"></div>
    <div>
      <div class="label">Waar wil je oefenen?</div>
      <div class="chips" id="conts"></div>
      <div class="label">Hoe moeilijk?</div>
      <div class="levels" id="levels"></div>
      <div class="label">Kies een spelletje</div>
      <div id="modes"></div>
    </div>
  </section>

  <section class="screen" id="s-learn">
    <div class="topbar"><button class="icon-btn" data-home aria-label="Terug">🏠</button><div class="counter" id="learnCount"></div><span style="width:52px"></span></div>
    <div class="learn-card">
      <div class="f" id="learnFlag"></div>
      <p class="bigname" id="learnName"></p>
      <p class="hint" id="learnHint"></p>
      <span class="cont-tag" id="learnCont"></span>
    </div>
    <div class="learn-nav">
      <button id="prevBtn" aria-label="Vorige">⬅️</button>
      <button class="speak" id="sayBtn" aria-label="Voorlezen">🔊</button>
      <button id="nextBtn" aria-label="Volgende">➡️</button>
    </div>
  </section>

  <section class="screen" id="s-quiz">
    <div class="topbar"><button class="icon-btn" data-home aria-label="Stoppen">🏠</button><div class="dots" id="dots"></div><div class="stars">⭐ <span id="starCount">0</span></div></div>
    <div class="question" id="question"></div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <section class="screen" id="s-end">
    <div class="end">
      <div class="trophy" id="trophy">🏆</div>
      <h2 id="endTitle"></h2>
      <div class="starline" id="endStars"></div>
      <div id="reviewWrap" style="display:none"><p class="sub" style="margin-bottom:8px">Deze nog even oefenen:</p><div class="review" id="review"></div></div>
      <div class="btns">
        <button class="again" id="againBtn">🔁 Nog een keer</button>
        <button class="home" data-home>🏠 Naar het begin</button>
      </div>
    </div>
  </section>
</div>

  {id:'OC', e:'🦘', t:'Oceanië'}
];
var LEVELS = [{n:1,e:'🐣',t:'Makkelijk'},{n:2,e:'🦊',t:'Gemiddeld'},{n:3,e:'🦉',t:'Moeilijk'}];
var MODES = [
  {id:'learn', c:'m1', e:'📖', t:'Leren', s:'Bekijk en luister naar alle vlaggen'},
  {id:'find',  c:'m2', e:'🔎', t:'Zoek de vlag', s:'Luister en kies uit een paar vlaggen'},
  {id:'all',   c:'m3', e:'🌈', t:'Alle vlaggen', s:'Luister en zoek hem tussen álle vlaggen'},
  {id:'which', c:'m4', e:'🤔', t:'Welk land?', s:'Kijk naar de vlag en kies het land'},
  {id:'map',   c:'m5', e:'🗺️', t:'Op de kaart', s:'Zet de vlag op het goede land'}
];

var store = {
  get:function(k,d){ try{ var v=localStorage.getItem('vlag:'+k); return v===null?d:JSON.parse(v);}catch(e){return d} },
  set:function(k,v){ try{ localStorage.setItem('vlag:'+k, JSON.stringify(v)); }catch(e){} }
};
var level = store.get('level',1), cont = store.get('cont','WO'), soundOn = store.get('sound',true), mode=null;
if(!CONTS.some(function(c){return c.id===cont;})) cont='WO';

function $(s){ return document.querySelector(s); }
function flagImg(code){ return '<img alt="" src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(FLAGS[code])+'">'; }
function flagEl(code){ var d=document.createElement('div'); d.className='f'; d.innerHTML=flagImg(code); return d; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function inCont(c){ return cont==='WO' || c.cont===cont; }
function pool(){
  var p = COUNTRIES.filter(function(c){ return inCont(c) && c.level<=level; });
  if(p.length<4) p = COUNTRIES.filter(inCont);
  return p;
}
function contName(id){ for(var i=0;i<CONTS.length;i++) if(CONTS[i].id===id) return CONTS[i].e+' '+CONTS[i].t; return ''; }

/* ---------- Geluid: alleen landnamen en goed/fout ---------- */
var player=null, playQueue=[];
function playNext(){
  if(!playQueue.length) return;
  var src = AUDIO[playQueue.shift()];
  if(!src){ playNext(); return; }
  try{
    player = player || new Audio();
    player.onended = playNext;
    player.src = 'data:audio/mpeg;base64,'+src;
    var pr = player.play(); if(pr && pr.catch) pr.catch(function(){});
  }catch(e){}
}
function say(){ if(!soundOn) return; playQueue = Array.prototype.slice.call(arguments); try{ if(player) player.pause(); }catch(e){} playNext(); }
function stopSay(){ playQueue=[]; try{ if(player) player.pause(); }catch(e){} }
var actx=null;
function tone(notes){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    var t = actx.currentTime;
    notes.forEach(function(n){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=n[2]||'sine'; o.frequency.value=n[0]; g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+n[1]);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+n[1]); t+=n[1]*0.8;
    });
  }catch(e){}
}
function ding(){ tone([[660,.12],[880,.12],[1320,.25]]); }
function bonk(){ tone([[220,.18,'triangle'],[180,.25,'triangle']]); }
function fanfare(){ tone([[523,.15],[659,.15],[784,.15],[1047,.4]]); }
var PRAISE=['Goed zo!','Super!','Knap hoor!','Top!'];

/* ---------- Schermen ---------- */
function show(id){ var s=document.querySelectorAll('.screen'); for(var i=0;i<s.length;i++) s[i].className = 'screen'+(s[i].id==='s-'+id?' on':''); window.scrollTo(0,0); }
var homes=document.querySelectorAll('[data-home]');
for(var hi=0;hi<homes.length;hi++) homes[hi].onclick=function(){ stopSay(); renderHome(); show('home'); };

function renderHome(){
  var hero=$('#heroFlags'); hero.innerHTML='';
  shuffle(COUNTRIES.filter(inCont)).slice(0,5).forEach(function(c,i){ var f=flagEl(c.code); f.style.animationDelay=(i*.2)+'s'; hero.appendChild(f); });
  var ce=$('#conts'); ce.innerHTML='';
  CONTS.forEach(function(C){
    var b=document.createElement('button'); b.className='chip'+(C.id===cont?' sel':''); b.textContent=C.e+' '+C.t;
    b.onclick=function(){ cont=C.id; store.set('cont',cont); tone([[620,.08]]); renderHome(); };
    ce.appendChild(b);
  });
  var lv=$('#levels'); lv.innerHTML='';
  LEVELS.forEach(function(L){
    var n = COUNTRIES.filter(function(c){ return inCont(c) && c.level<=L.n; }).length;
    var b=document.createElement('button'); b.className='lvl'+(L.n===level?' sel':'');
    b.innerHTML='<span class="e">'+L.e+'</span>'+L.t+'<small>'+Math.max(n, Math.min(4,COUNTRIES.filter(inCont).length))+' vlaggen</small>';
    b.onclick=function(){ level=L.n; store.set('level',level); tone([[500+L.n*120,.1]]); renderHome(); };
    lv.appendChild(b);
  });
  var me=$('#modes'); me.innerHTML='';
  MODES.forEach(function(M){
    var best = M.id==='learn'?null:store.get('best:'+M.id+':'+cont+':'+level,null);
    var b=document.createElement('button'); b.className='mode '+M.c;
    b.innerHTML='<span class="e">'+M.e+'</span><span class="t">'+M.t+'<small>'+M.s+'</small></span>'+(best?'<span class="best">⭐ '+best+'</span>':'');
    b.onclick=function(){ mode=M.id; if(mode==='learn') startLearn(); else startQuiz(); };
    me.appendChild(b);
  });
  $('#soundBtn').textContent = soundOn?'🔊':'🔇';
}
$('#soundBtn').onclick=function(){ soundOn=!soundOn; store.set('sound',soundOn); renderHome(); if(soundOn) say('Goed zo!'); };

/* ---------- Leren ---------- */
var learnList=[], li=0;
function startLearn(){ learnList = pool(); li=0; show('learn'); renderLearn(true); }
function renderLearn(speak){
  var c = learnList[li];
  $('#learnFlag').innerHTML=flagImg(c.code);
  $('#learnName').textContent=c.name; $('#learnHint').textContent=c.hint; $('#learnCont').textContent=contName(c.cont);
  $('#learnCount').textContent=(li+1)+' van '+learnList.length;
  if(speak) say(c.name);
}
$('#prevBtn').onclick=function(){ li=(li-1+learnList.length)%learnList.length; renderLearn(true); };
$('#nextBtn').onclick=function(){ li=(li+1)%learnList.length; renderLearn(true); };
$('#sayBtn').onclick=function(){ renderLearn(true); };
$('#learnFlag').onclick=function(){ renderLearn(true); };

/* ---------- Quiz ---------- */
var queue=[], qi=0, stars=0, results=[], missed=[], locked=false, current=null, ROUND=10, P=[];
function startQuiz(){
  P = pool();
  ROUND = Math.min(10, P.length);
  queue = shuffle(P).slice(0,ROUND);
  qi=0; stars=0; results=[]; missed=[];
  show('quiz');
  if(mode==='map') buildMap();
  nextQuestion();
}
function renderDots(){
  var d=$('#dots'); d.innerHTML='';
  for(var i=0;i<ROUND;i++){ var s=document.createElement('span'); s.className='dot'+(results[i]===true?' ok':results[i]===false?' no':i===qi?' now':''); d.appendChild(s); }
  $('#starCount').textContent=stars;
}
function speakBtn(fn){ var b=document.createElement('button'); b.className='mini-speak'; b.textContent='🔊'; b.setAttribute('aria-label','Luisteren'); b.onclick=function(e){ e.stopPropagation(); fn(); }; return b; }

function nextQuestion(){
  locked=false; $('#feedback').innerHTML='';
  current = queue[qi];
  renderDots();
  var q=$('#question'), o=$('#options'); q.innerHTML=''; q.className='question';
  if(mode!=='map') o.innerHTML='';

  if(mode==='find' || mode==='all'){
    q.innerHTML='<p class="ask">Waar is de vlag van…</p><p class="target"><span>'+current.name+'</span></p>';
    q.querySelector('.target').appendChild(speakBtn(function(){ say(current.name); }));
    var opts;
    if(mode==='find'){
      var n = level===1?3:4;
      opts = shuffle([current].concat(shuffle(P.filter(function(c){return c.code!==current.code;})).slice(0,n-1)));
    } else opts = shuffle(P);
    var g=document.createElement('div');
    g.className='grid'+(mode==='find'&&opts.length===3?' three':'')+(mode==='all'?(opts.length>15?' many4':' many'):'');
    opts.forEach(function(c){ var b=document.createElement('button'); b.className='opt'; b._code=c.code; b.appendChild(flagEl(c.code)); b.onclick=function(){ answer(c.code,b,g); }; g.appendChild(b); });
    o.appendChild(g);
    say(current.name);
  } else if(mode==='which'){
    q.innerHTML='<p class="ask">Van welk land is deze vlag?</p>'; q.appendChild(flagEl(current.code));
    var opts2 = shuffle([current].concat(shuffle(P.filter(function(c){return c.code!==current.code;})).slice(0,(level===1?3:4)-1)));
    var g2=document.createElement('div'); g2.className='names';
    opts2.forEach(function(c){
      var b=document.createElement('div'); b.className='opt nameopt'; b._code=c.code; b.setAttribute('role','button');
      b.innerHTML='<span class="t">'+c.name+'</span>';
      b.appendChild(speakBtn(function(){ say(c.name); }));
      b.onclick=function(){ answer(c.code,b,g2); }; g2.appendChild(b);
    });
    o.appendChild(g2);
  } else if(mode==='map'){
    q.className='question small-flag';
    q.appendChild(flagEl(current.code));
    var t=document.createElement('div'); t.style.flex='1';
    t.innerHTML='<p class="ask" style="margin:0">Waar ligt…</p><p class="target" style="justify-content:flex-start;font-size:26px"><span>'+current.name+'</span></p>';
    t.querySelector('.target').appendChild(speakBtn(function(){ say(current.name); }));
    q.appendChild(t);
    say(current.name);
  }
}

function answer(code, btn, group){
  if(locked) return; locked=true;
  var ok = code===current.code;
  var all = group ? Array.prototype.slice.call(group.children) : [];
  if(ok){
    if(btn){ btn.className+=' ok'; all.forEach(function(b){ if(b!==btn) b.className+=' dim'; }); burst(btn); }
    stars++; results[qi]=true; ding();
    var p=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    $('#feedback').textContent='⭐ '+p;
    say(p, current.name);
    renderDots();
    setTimeout(advance, 1800);
  } else {
    if(btn) btn.className+=' no';
    results[qi]=false; bonk();
    if(missed.indexOf(current)<0) missed.push(current);
    var right=null;
    all.forEach(function(b){ if(b._code===current.code){ b.className+=' ok'; right=b; } else if(b!==btn) b.className+=' dim'; });
    if(right && mode==='all' && right.scrollIntoView){ try{ right.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){ right.scrollIntoView(); } }
    var fb=$('#feedback'); fb.innerHTML='';
    var t=document.createElement('div');
    t.textContent = mode==='which' ? 'Oeps! Het is '+current.name+'.' : mode==='map' ? 'Oeps! '+current.name+' is groen.' : 'Oeps! De goede vlag is groen.';
    var nx=document.createElement('button'); nx.className='next'; nx.textContent='Verder ➡️'; nx.onclick=advance;
    fb.appendChild(t); fb.appendChild(nx);
    say('Oeps!', current.name);
    renderDots();
  }
}
function advance(){ qi++; if(qi<ROUND){ nextQuestion(); if(mode!=='map') window.scrollTo(0,0); } else endQuiz(); }

/* ---------- Kaart ---------- */
var SVGNS='http://www.w3.org/2000/svg', svg=null, vb=null;
function buildMap(){
  var o=$('#options'); o.innerHTML='';
  vb = MAP.views[cont];
  var box=document.createElement('div'); box.className='mapbox';
  svg=document.createElementNS(SVGNS,'svg'); svg.setAttribute('viewBox', vb.join(' '));
  var sw = vb[2]/400;
  var codes = {}; P.forEach(function(c){ codes[c.code]=1; });
  MAP.shapes.forEach(function(s){
    var p=document.createElementNS(SVGNS,'path'); p.setAttribute('d', s[1]);
    p.setAttribute('class','land'+(codes[s[0]]?' play':'')); p.setAttribute('stroke-width', sw);
    if(s[0]) p.setAttribute('data-c', s[0]);
    svg.appendChild(p);
  });
  svg.addEventListener('click', mapClick);
  box.appendChild(svg); o.appendChild(box);
  var h=document.createElement('p'); h.className='maphint'; h.textContent='Tik op het goede land. De gele landen doen mee.'; o.appendChild(h);
}
function landEl(code){ return svg.querySelector('path[data-c="'+code+'"]'); }
function mapClick(e){
  if(locked) return;
  var code = e.target && e.target.getAttribute && e.target.getAttribute('data-c');
  var inPool = code && P.some(function(c){ return c.code===code; });
  if(!inPool){
    // klein land gemist? kies het dichtstbijzijnde meedoende land
    var pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    var m=svg.getScreenCTM(); if(!m) return; var sp=pt.matrixTransform(m.inverse());
    var best=null, bd=1e9;
    P.forEach(function(c){ var ce=MAP.cent[c.code]; var d=Math.sqrt(Math.pow(ce[0]-sp.x,2)+Math.pow(ce[1]-sp.y,2)); if(d<bd){ bd=d; best=c.code; } });
    if(bd < vb[2]*0.05) code=best; else return;
  }
  var el=landEl(code);
  if(code===current.code){
    el.setAttribute('class','land play right'); addPin(code); answer(code,null,null);
  } else {
    el.setAttribute('class','land play wrong');
    var r=landEl(current.code); r.setAttribute('class','land play flash');
    setTimeout(function(){ el.setAttribute('class','land play'); }, 1400);
    answer(code,null,null);
    var nx=document.querySelector('#feedback .next');
    if(nx){ var old=nx.onclick; nx.onclick=function(){ r.setAttribute('class','land play right'); addPin(current.code); old(); }; }
  }
}
function addPin(code){
  var ce=MAP.cent[code], w=vb[2]*0.07, h=w*2/3;
  var g=document.createElementNS(SVGNS,'g'); g.setAttribute('class','pin');
  var pole=document.createElementNS(SVGNS,'line');
  pole.setAttribute('x1',ce[0]); pole.setAttribute('y1',ce[1]); pole.setAttribute('x2',ce[0]); pole.setAttribute('y2',ce[1]-h*1.6);
  pole.setAttribute('stroke','#2b2350'); pole.setAttribute('stroke-width', w*0.06);
  var img=document.createElementNS(SVGNS,'image');
  img.setAttribute('x',ce[0]); img.setAttribute('y',ce[1]-h*1.6); img.setAttribute('width',w); img.setAttribute('height',h);
  var href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(FLAGS[code]);
  img.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',href); img.setAttribute('href',href);
  var dot=document.createElementNS(SVGNS,'circle'); dot.setAttribute('cx',ce[0]); dot.setAttribute('cy',ce[1]); dot.setAttribute('r',w*0.07); dot.setAttribute('fill','#2b2350');
  g.appendChild(pole); g.appendChild(img); g.appendChild(dot); svg.appendChild(g);
}

/* ---------- Einde ---------- */
function endQuiz(){
  stopSay();
  var key='best:'+mode+':'+cont+':'+level, prev=store.get(key,null), score=stars+'/'+ROUND;
  if(prev===null || stars>parseInt(prev,10)) store.set(key,score);
  $('#endStars').textContent = new Array(stars+1).join('⭐') + new Array(ROUND-stars+1).join('☆');
  var title, emoji;
  if(stars===ROUND){ title='Alles goed! Wat knap!'; emoji='🏆'; }
  else if(stars>=ROUND*0.7){ title='Heel goed gedaan!'; emoji='🥇'; }
  else if(stars>=ROUND*0.4){ title='Goed bezig!'; emoji='🌟'; }
  else { title='Goed geprobeerd!'; emoji='💪'; }
  $('#endTitle').textContent=title; $('#trophy').textContent=emoji;
  var rv=$('#review'); rv.innerHTML='';
  missed.forEach(function(m){ var f=flagEl(m.code); f.onclick=function(){ say(m.name); }; rv.appendChild(f); });
  $('#reviewWrap').style.display = missed.length?'':'none';
  show('end'); fanfare(); confetti(stars===ROUND?140:60);
}
$('#againBtn').onclick=startQuiz;

function burst(el){
  var r=el.getBoundingClientRect(), s=document.createElement('div'); s.className='burst'; s.textContent='⭐';
  s.style.left=(r.left+r.width/2-27)+'px'; s.style.top=(r.top+r.height/2-30)+'px'; document.body.appendChild(s); setTimeout(function(){ s.parentNode&&s.parentNode.removeChild(s); },900);
}
function confetti(n){
  var cols=['#ff6b6b','#ffc43d','#2ec4a6','#4d96ff','#9b5de5','#ff8fab'];
  for(var i=0;i<n;i++){ (function(i){
    var c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2+Math.random()*2)+'s'; c.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(c); setTimeout(function(){ c.parentNode&&c.parentNode.removeChild(c); },5000);
  })(i); }
}
document.addEventListener('touchstart',function(){},true);
renderHome();
</script>
</body>
</html>
